<!doctype html>
<html lang="es" class="dark" data-theme="noir">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- SEO & Metadata -->
    <title>Mis Gastos — Finanzas Personales & Presupuesto</title>
    <meta name="description" content="PWA moderna y offline-first para control de finanzas personales, presupuesto quincenal/mensual, metas de ahorro y balance en tiempo real." />
    <meta name="robots" content="noindex, nofollow" />

    <!-- PWA / Mobile Web App Standalone -->
    <meta name="theme-color" content="#0a0a0c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mis Gastos" />
    <meta name="application-name" content="Mis Gastos" />

    <!-- Favicon & Manifest -->
    <link rel="icon" type="image/svg+xml" href="/icons.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Google Fonts preconnect (performance) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body class="bg-[var(--bg-main)] text-[var(--text-primary)]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
